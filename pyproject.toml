[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtr-scaler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gtr-scaler = "gtr_scaler.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
