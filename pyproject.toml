[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtr-scaler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fretboard==1.0.0",
    "cairosvg>=2.7.0",
    "pypdf>=4.0",
]

[project.scripts]
gtr-scaler = "gtr_scaler.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"gtr_scaler/renderers/svg.py" = ["E402"]
"tests/renderers/test_ascii.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# Untyped third-party libraries
[[tool.mypy.overrides]]
module = ["fretboard.*", "cairosvg.*"]
ignore_missing_imports = true

# Tests are intentionally untyped; relax strictness
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
