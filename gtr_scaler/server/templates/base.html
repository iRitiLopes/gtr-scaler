<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gtr Scaler{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* ── Note circle buttons ───────────────────────────────────────────── */
    .gs-note-btn {
      width: 48px; height: 48px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      border: 2px solid #dee2e6; background: #fff; cursor: pointer;
      font-weight: 600; font-size: 14px; margin: 4px;
      transition: all 0.15s ease;
    }
    .gs-note-btn:hover { border-color: #adb5bd; }
    .gs-note-btn:focus-visible { outline: 2px solid #0d6efd; outline-offset: 2px; }
    .gs-note-btn.selected { background: #0d6efd; color: #fff; border-color: #0d6efd; }

    /* ── Scale pill buttons ────────────────────────────────────────────── */
    .gs-scale-btn {
      display: inline-block; padding: 8px 16px; border-radius: 999px;
      border: 2px solid transparent; cursor: pointer; font-size: 14px;
      margin: 3px 4px; color: #fff; transition: all 0.15s ease;
    }
    .gs-scale-btn:hover { opacity: 0.85; }
    .gs-scale-btn:focus-visible { outline: 2px solid #000; outline-offset: 2px; }
    .gs-scale-btn.selected { box-shadow: 0 0 0 3px rgba(0,0,0,0.35); border-color: #212529; }

    /* ── Button group wrapper ──────────────────────────────────────────── */
    .gs-btn-group-wrap { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Gtr Scaler</a>
    </div>
  </nav>
  <main class="container my-4 flex-grow-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="text-center text-muted py-3">
    <div class="container">
      <small>Gtr Scaler &mdash; Guitar scale diagram generator</small>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
